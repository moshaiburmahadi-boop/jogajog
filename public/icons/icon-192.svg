<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- App Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <!-- Ambient Aura -->
  <circle cx="96" cy="96" r="60" fill="#38bdf8" opacity="0.25" filter="url(#glow)"/>
  <circle cx="120" cy="80" r="45" fill="#ec4899" opacity="0.2" filter="url(#glow)"/>
  
  <!-- Apple Frosted Squircle -->
  <rect x="36" y="36" width="120" height="120" rx="30" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  
  <!-- Modern Social Camera / Lens Symbol -->
  <circle cx="96" cy="96" r="32" stroke="url(#irisGrad)" stroke-width="5" fill="rgba(15,23,42,0.4)" />
  <circle cx="96" cy="96" r="16" fill="url(#irisGrad)"/>
  <circle cx="126" cy="66" r="6" fill="#38bdf8"/>
</svg>
