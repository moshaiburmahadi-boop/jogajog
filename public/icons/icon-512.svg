<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glassGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
    <linearGradient id="irisGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <!-- Ambient Aura -->
  <circle cx="256" cy="256" r="160" fill="#38bdf8" opacity="0.25" filter="url(#glow512)"/>
  <circle cx="320" cy="210" r="120" fill="#ec4899" opacity="0.2" filter="url(#glow512)"/>
  
  <!-- Apple Frosted Squircle -->
  <rect x="96" y="96" width="320" height="320" rx="80" fill="url(#glassGrad512)" stroke="rgba(255,255,255,0.35)" stroke-width="4"/>
  
  <!-- Modern Social Camera / Lens Symbol -->
  <circle cx="256" cy="256" r="86" stroke="url(#irisGrad512)" stroke-width="14" fill="rgba(15,23,42,0.45)" />
  <circle cx="256" cy="256" r="42" fill="url(#irisGrad512)"/>
  <circle cx="336" cy="176" r="16" fill="#38bdf8"/>
</svg>
